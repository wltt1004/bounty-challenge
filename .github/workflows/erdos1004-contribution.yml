name: Erdős 1004 contribution compile

on:
  push:
    branches:
      - erdos1004-contribution-work
    paths:
      - "lean-test/**"
      - ".github/workflows/erdos1004-contribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Elan and Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update pinned dependencies
        working-directory: lean-test
        run: lake update
      - name: Download Mathlib cache
        working-directory: lean-test
        run: lake exe cache get
      - name: Compile contribution
        working-directory: lean-test
        run: lake build
