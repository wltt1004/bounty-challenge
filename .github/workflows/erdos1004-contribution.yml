name: Erdős 1004 contribution compile

on:
  push:
    branches:
      - erdos1004-contribution-work
    paths:
      - "lean-test/**"
      - ".github/workflows/erdos1004-contribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean-test
          build: true
          use-mathlib-cache: true
