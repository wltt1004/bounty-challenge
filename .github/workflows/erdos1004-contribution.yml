name: Erdős 1004 contribution compile

on:
  push:
    branches:
      - erdos1004-contribution-work
    paths:
      - "lean-test/**"
      - "contribution-draft/**"
      - "ERDOS1004_SUBMISSION.md"
      - ".github/workflows/erdos1004-contribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Formal Conjectures
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/google-deepmind/formal-conjectures.git formal-conjectures
          git -C formal-conjectures fetch --depth=1 origin \
            379fc0298dc146df549e7061c3ede0353a5bb51f
          git -C formal-conjectures checkout --detach FETCH_HEAD
          cp lean-test/Erdos1004ContributionTest.lean \
            formal-conjectures/Erdos1004ContributionTest.lean
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        working-directory: formal-conjectures
        run: lake exe cache get
      - name: Build the pinned target module
        working-directory: formal-conjectures
        run: lake build 'FormalConjectures.ErdosProblems.«1004»'
      - name: Compile contribution against pinned target
        working-directory: formal-conjectures
        run: lake env lean Erdos1004ContributionTest.lean
      - name: Run official contribution static preflight
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            https://github.com/conjectures-io/conjectures-contribution.git \
            contribution-tool
          contribution-tool/install.sh
          mkdir -p preflight-draft
          cp lean-test/Erdos1004ContributionTest.lean preflight-draft/script.lean
          cp contribution-draft/draft.json preflight-draft/draft.json
          cp contribution-draft/sources.md preflight-draft/sources.md
          "$HOME/.local/bin/contrib" key generate --path /tmp/contribution-author.key
          cd contribution-tool
          PROMOTED=$("$HOME/.local/bin/contrib" promote erdos-1004 \
            --from "$GITHUB_WORKSPACE/preflight-draft" \
            --key /tmp/contribution-author.key \
            --no-reward)
          "$HOME/.local/bin/contrib" check "$PROMOTED"
      - name: Assemble promotion-ready draft
        run: |
          mkdir -p artifact/drafts/erdos-1004
          cp lean-test/Erdos1004ContributionTest.lean \
            artifact/drafts/erdos-1004/script.lean
          cp contribution-draft/draft.json \
            artifact/drafts/erdos-1004/draft.json
          cp contribution-draft/sources.md \
            artifact/drafts/erdos-1004/sources.md
          cp ERDOS1004_SUBMISSION.md artifact/SUBMISSION.md
          find artifact -type f -print -exec sha256sum {} \;
      - name: Upload promotion-ready draft
        uses: actions/upload-artifact@v4
        with:
          name: erdos1004-collision-contribution-draft
          path: artifact/
          if-no-files-found: error
          retention-days: 30
