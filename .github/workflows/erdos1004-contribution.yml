name: Erdős 1004 contribution compile

on:
  push:
    branches:
      - erdos1004-contribution-work
    paths:
      - "lean-test/**"
      - ".github/workflows/erdos1004-contribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Formal Conjectures
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/google-deepmind/formal-conjectures.git formal-conjectures
          git -C formal-conjectures fetch --depth=1 origin \
            379fc0298dc146df549e7061c3ede0353a5bb51f
          git -C formal-conjectures checkout --detach FETCH_HEAD
          cp lean-test/Erdos1004ContributionTest.lean \
            formal-conjectures/Erdos1004ContributionTest.lean
      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        working-directory: formal-conjectures
        run: lake exe cache get
      - name: Compile contribution against pinned target
        working-directory: formal-conjectures
        run: lake env lean Erdos1004ContributionTest.lean
