name: Erdos 218 Module Build Probe

on:
  push:
    branches:
      - "chatgpt/erdos218-lab"
    paths:
      - ".github/workflows/erdos218-module-build-probe.yml"
  workflow_dispatch:

concurrency:
  group: erdos218-module-build-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and build only the target module
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --filter=blob:none https://github.com/google-deepmind/formal-conjectures.git formal-conjectures
          git -C formal-conjectures checkout 379fc0298dc146df549e7061c3ede0353a5bb51f
          cd formal-conjectures
          lake update
          lake exe cache get
          lake build 'FormalConjectures.ErdosProblems.«218»'
