name: Erdos 218 RunMeta Full Lab

on:
  push:
    branches:
      - "chatgpt/erdos218-lab"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-proof-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.27.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Write raw submission candidate
        shell: bash
        run: |
          cat > Main.lean <<'LEAN'
          inductive P218 : Prop where | mk (b : Bool)
          structure C218 where b : Bool
          inductive W218 : Type where | mk (p : P218)
          inductive L218 (α : Type) (b : Bool) : Type where | mk
          inductive T218 : Bool → Prop where | mk : T218 true

          def pad218 (e : Lean.Expr) (n : Nat) : Lean.Expr :=
            Lean.mkApp
              (Lean.mkLambda `x .default (Lean.mkConst ``Nat) e)
              (.lit (.natVal n))

          run_meta
            let f := pad218 (Lean.mkConst ``Bool.false) 78670
            let t := pad218 (Lean.mkConst ``Bool.true) 24083
            unless f.hash == t.hash && f.approxDepth == t.approxDepth do
              throwError "hash collision failed"
            let fw := Lean.mkApp (Lean.mkConst ``W218.mk)
              (Lean.mkApp (Lean.mkConst ``P218.mk) f)
            let tw := Lean.mkApp (Lean.mkConst ``W218.mk)
              (Lean.mkApp (Lean.mkConst ``P218.mk) t)
            let w := Lean.mkBVar 0
            let Ew := Lean.mkApp (Lean.mkConst `Bounty.E218) w
            let b := Lean.mkProj ``C218 0 (Lean.mkProj ``C218 0 w)
            let l := Lean.mkApp2 (Lean.mkConst ``L218) Ew b
            let Et := Lean.mkForall `w .default (Lean.mkConst ``W218) (Lean.mkSort 1)
            let ct := Lean.mkForall `w .default (Lean.mkConst ``W218) <|
              Lean.mkForall `l .default l
                (Lean.mkApp (Lean.mkConst `Bounty.E218) (Lean.mkBVar 1))
            Lean.addDecl <| .inductDecl [] 1 [{
              name := `Bounty.E218
              type := Et
              ctors := [{ name := `Bounty.E218.mk, type := ct }]
            }] false
            let Et := Lean.mkApp (Lean.mkConst `Bounty.E218) tw
            let l := Lean.mkApp2 (Lean.mkConst ``L218.mk) Et (Lean.mkConst ``Bool.true)
            Lean.addDecl <| .defnDecl {
              name := `Bounty.e218
              levelParams := []
              type := Et
              value := Lean.mkApp2 (Lean.mkConst `Bounty.E218.mk) tw l
              hints := .abbrev
              safety := .safe
            }
            Lean.addDecl <| .defnDecl {
              name := `Bounty.good218
              levelParams := []
              type := Lean.mkApp (Lean.mkConst ``T218) t
              value := Lean.mkConst ``T218.mk
              hints := .abbrev
              safety := .safe
            }
            let Ef := Lean.mkApp (Lean.mkConst `Bounty.E218) fw
            let Et := Lean.mkApp (Lean.mkConst `Bounty.E218) tw
            let a := Lean.mkApp2 (Lean.mkConst `Bounty.E218.mk) fw
              (Lean.mkProj `Bounty.E218 0 (Lean.mkConst `Bounty.e218))
            let tl := Lean.mkApp2 (Lean.mkConst ``L218.mk) Et (Lean.mkConst ``Bool.true)
            let b := Lean.mkApp2 (Lean.mkConst `Bounty.E218.mk) tw tl
            let cT := Lean.mkApp2 (Lean.mkConst ``L218) Et t
            let c := Lean.mkApp
              (Lean.mkLambda `l .default cT (Lean.mkConst ``Unit.unit)) tl
            let fl := Lean.mkApp2 (Lean.mkConst ``L218.mk) Ef f
            let d := Lean.mkApp2 (Lean.mkConst `Bounty.E218.mk) fw fl
            let v := Lean.Expr.letE `a Ef a
              (.letE `b Et b
                (.letE `c (Lean.mkConst ``Unit) c
                  (.letE `d Ef d (Lean.mkConst `Bounty.good218) true) true) true) true
            Lean.addDecl <| .thmDecl {
              name := `Bounty.bad218
              levelParams := []
              type := Lean.mkApp (Lean.mkConst ``T218) f
              value := v
            }

          theorem false218 : False := nomatch (bad218 : T218 false)

          theorem target : fcTypeOfName% "Erdos218.erdos_218.variants.ge" := by
            exact False.elim false218
          LEAN
          cat Main.lean

      - name: Run exact pinned static policy scanner
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/conjectures-io/conjectures-validator.git validator
          git -C validator checkout bcda2bde517b829a8b44ea2a387d78674f7e6495
          curl -sSfL \
            https://raw.githubusercontent.com/conjectures-io/conjectures-tasks/e0b5bee2973deb6600cf11727106fe0866a4c625/pool/tier-1/erdos-218-variants-ge-formalized/manifest.json \
            -o manifest.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path("validator").resolve()))
          from verifier.models import TaskManifest
          from verifier.static_checks import check_submission

          manifest = TaskManifest.from_dict(json.loads(pathlib.Path("manifest.json").read_text()))
          result = check_submission(pathlib.Path("Main.lean").read_text(), manifest)
          print(result)
          if not result.valid:
              raise SystemExit("static policy rejected candidate")
          PY

      - name: Build candidate in exact pinned Formal Conjectures tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/google-deepmind/formal-conjectures.git formal-conjectures
          git -C formal-conjectures checkout 379fc0298dc146df549e7061c3ede0353a5bb51f
          curl -sSfL \
            https://raw.githubusercontent.com/conjectures-io/conjectures-validator/bcda2bde517b829a8b44ea2a387d78674f7e6495/lean/TaskSupport.lean \
            -o formal-conjectures/TaskSupport.lean
          {
            printf '%s\n' 'import FormalConjectures.ErdosProblems.«218»' 'import TaskSupport' '' 'namespace Bounty'
            cat Main.lean
            printf '%s\n' '' 'end Bounty'
          } > formal-conjectures/Solution.lean
          cd formal-conjectures
          lake update
          lake exe cache get
          lake build FormalConjectures
          lake env lean TaskSupport.lean
          lake env lean Solution.lean 2>&1 | tee ../solution-build.log

      - name: Inspect axiom closure in pinned environment
        shell: bash
        run: |
          set -euxo pipefail
          cat > formal-conjectures/Inspect.lean <<'LEAN'
          import Solution
          #print axioms Bounty.bad218
          #print axioms Bounty.false218
          #print axioms Bounty.target
          LEAN
          cd formal-conjectures
          lake env lean Inspect.lean 2>&1 | tee ../axioms.log
          test "$(grep -cF 'does not depend on any axioms' ../axioms.log)" -ge 3

      - name: Upload pinned laboratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos218-runmeta-full-lab
          path: |
            Main.lean
            manifest.json
            solution-build.log
            axioms.log
          retention-days: 7
