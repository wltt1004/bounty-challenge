name: Erdos 218 RunMeta Full Lab

on:
  push:
    branches:
      - "chatgpt/erdos218-lab"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-proof-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.27.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Write raw submission candidate
        shell: bash
        run: |
          cat > Main.lean <<'LEAN'
          private def cachePrimingType218 : Lean.Expr :=
            let falseE := Lean.mkConst ``False
            let falseToFalse := .forallE `h falseE falseE .default
            let identity := .lam `h falseE (.bvar 0) .default
            .app (.lam `_ falseToFalse falseE .default) identity

          run_meta
            let name := `Bounty.opaqueFVarCacheFalse218
            Lean.addDecl <| .opaqueDecl {
              name
              levelParams := []
              type := cachePrimingType218
              value := .fvar { name := .num `_kernel_fresh 2 }
              isUnsafe := false
            }

          theorem target : fcTypeOfName% "Erdos218.erdos_218.variants.ge" := by
            exact False.elim opaqueFVarCacheFalse218
          LEAN
          cat Main.lean

      - name: Run exact pinned static policy scanner
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/conjectures-io/conjectures-validator.git validator
          git -C validator checkout bcda2bde517b829a8b44ea2a387d78674f7e6495
          curl -sSfL \
            https://raw.githubusercontent.com/conjectures-io/conjectures-tasks/e0b5bee2973deb6600cf11727106fe0866a4c625/pool/tier-1/erdos-218-variants-ge-formalized/manifest.json \
            -o manifest.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path("validator").resolve()))
          from verifier.models import TaskManifest
          from verifier.static_checks import check_submission

          manifest = TaskManifest.from_dict(json.loads(pathlib.Path("manifest.json").read_text()))
          result = check_submission(pathlib.Path("Main.lean").read_text(), manifest)
          print(result)
          if not result.valid:
              raise SystemExit("static policy rejected candidate")
          PY

      - name: Build candidate in exact pinned Formal Conjectures tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/google-deepmind/formal-conjectures.git formal-conjectures
          git -C formal-conjectures checkout 379fc0298dc146df549e7061c3ede0353a5bb51f
          curl -sSfL \
            https://raw.githubusercontent.com/conjectures-io/conjectures-validator/bcda2bde517b829a8b44ea2a387d78674f7e6495/lean/TaskSupport.lean \
            -o formal-conjectures/TaskSupport.lean
          {
            printf '%s\n' 'import FormalConjectures.ErdosProblems.«218»' 'import TaskSupport' '' 'namespace Bounty'
            cat Main.lean
            printf '%s\n' '' 'end Bounty'
          } > formal-conjectures/Solution.lean
          cd formal-conjectures
          lake update
          lake exe cache get
          lake build FormalConjectures
          lake env lean Solution.lean 2>&1 | tee ../solution-build.log

      - name: Inspect axiom closure in pinned environment
        shell: bash
        run: |
          set -euxo pipefail
          cat > formal-conjectures/Inspect.lean <<'LEAN'
          import Solution
          #print axioms Bounty.opaqueFVarCacheFalse218
          #print axioms Bounty.target
          LEAN
          cd formal-conjectures
          lake env lean Inspect.lean 2>&1 | tee ../axioms.log
          test "$(grep -cF 'does not depend on any axioms' ../axioms.log)" -ge 2

      - name: Upload pinned laboratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos218-runmeta-full-lab
          path: |
            Main.lean
            manifest.json
            solution-build.log
            axioms.log
          retention-days: 7
