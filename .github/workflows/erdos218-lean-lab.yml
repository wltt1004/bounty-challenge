name: Erdos 218 Lean Lab

on:
  push:
    branches:
      - "chatgpt/erdos218-lab"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-kernel-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.27.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.27.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Test disclosed wrong-projection kernel construction
        shell: bash
        run: |
          set -euxo pipefail
          cat > Bug.lean <<'LEAN'
          import Lean
          open Lean Elab Command

          inductive P : Prop where | mk (b : Bool)
          structure C where b : Bool
          inductive W : Type where | mk (p : P)
          inductive L (α : Type) (b : Bool) : Type where | mk
          inductive T : Bool → Prop where | mk : T true

          def pad (e : Expr) (n : Nat) : Expr :=
            mkApp (mkLambda `x .default (mkConst ``Nat) e) (.lit (.natVal n))

          meta def build : CommandElabM Unit := do
            let f := pad (mkConst ``Bool.false) 78670
            let t := pad (mkConst ``Bool.true) 24083
            unless f.hash == t.hash && f.approxDepth == t.approxDepth do
              throwError "hash collision failed"
            let fw := mkApp (mkConst ``W.mk) (mkApp (mkConst ``P.mk) f)
            let tw := mkApp (mkConst ``W.mk) (mkApp (mkConst ``P.mk) t)
            let w := mkBVar 0
            let Ew := mkApp (mkConst `E) w
            let b := mkProj ``C 0 (mkProj ``C 0 w)
            let l := mkApp2 (mkConst ``L) Ew b
            let Et := mkForall `w .default (mkConst ``W) (mkSort 1)
            let ct := mkForall `w .default (mkConst ``W) <|
              mkForall `l .default l (mkApp (mkConst `E) (mkBVar 1))
            liftCoreM <| addDecl <| .inductDecl [] 1 [{
              name := `E, type := Et, ctors := [{ name := `E.mk, type := ct }] }] false
            let Et := mkApp (mkConst `E) tw
            let l := mkApp2 (mkConst ``L.mk) Et (mkConst ``Bool.true)
            liftCoreM <| addDecl <| .defnDecl {
              name := `e, levelParams := [], type := Et,
              value := mkApp2 (mkConst `E.mk) tw l,
              hints := .abbrev, safety := .safe }
            liftCoreM <| addDecl <| .defnDecl {
              name := `good', levelParams := [],
              type := mkApp (mkConst ``T) t, value := mkConst ``T.mk,
              hints := .abbrev, safety := .safe }
            let Ef := mkApp (mkConst `E) fw
            let Et := mkApp (mkConst `E) tw
            let a := mkApp2 (mkConst `E.mk) fw (mkProj `E 0 (mkConst `e))
            let tl := mkApp2 (mkConst ``L.mk) Et (mkConst ``Bool.true)
            let b := mkApp2 (mkConst `E.mk) tw tl
            let cT := mkApp2 (mkConst ``L) Et t
            let c := mkApp (mkLambda `l .default cT (mkConst ``Unit.unit)) tl
            let fl := mkApp2 (mkConst ``L.mk) Ef f
            let d := mkApp2 (mkConst `E.mk) fw fl
            let v := Expr.letE `a Ef a
              (.letE `b Et b
                (.letE `c (mkConst ``Unit) c
                  (.letE `d Ef d (mkConst `good') true) true) true) true
            liftCoreM <| addDecl <| .thmDecl {
              name := `bad, levelParams := [],
              type := mkApp (mkConst ``T) f, value := v }

          elab "mkbug" : command => build
          mkbug
          theorem boom : False := nomatch (bad : T false)
          #print axioms bad
          #print axioms boom
          LEAN
          lean --trust=0 Bug.lean 2>&1 | tee bug.log

      - name: Test closed construction using only policy-admitted run_meta
        shell: bash
        run: |
          set -euxo pipefail
          cat > RunMetaClosed.lean <<'LEAN'
          import Lean
          open Lean

          namespace Bounty

          inductive P218 : Prop where | mk (b : Bool)
          structure C218 where b : Bool
          inductive W218 : Type where | mk (p : P218)
          inductive L218 (α : Type) (b : Bool) : Type where | mk
          inductive T218 : Bool → Prop where | mk : T218 true

          def pad218 (e : Expr) (n : Nat) : Expr :=
            mkApp (mkLambda `x .default (mkConst ``Nat) e) (.lit (.natVal n))

          run_meta
            let f := pad218 (mkConst ``Bool.false) 78670
            let t := pad218 (mkConst ``Bool.true) 24083
            unless f.hash == t.hash && f.approxDepth == t.approxDepth do
              throwError "hash collision failed"
            let fw := mkApp (mkConst ``W218.mk) (mkApp (mkConst ``P218.mk) f)
            let tw := mkApp (mkConst ``W218.mk) (mkApp (mkConst ``P218.mk) t)
            let w := mkBVar 0
            let Ew := mkApp (mkConst `Bounty.E218) w
            let b := mkProj ``C218 0 (mkProj ``C218 0 w)
            let l := mkApp2 (mkConst ``L218) Ew b
            let Et := mkForall `w .default (mkConst ``W218) (mkSort 1)
            let ct := mkForall `w .default (mkConst ``W218) <|
              mkForall `l .default l (mkApp (mkConst `Bounty.E218) (mkBVar 1))
            Lean.addDecl <| .inductDecl [] 1 [{
              name := `Bounty.E218,
              type := Et,
              ctors := [{ name := `Bounty.E218.mk, type := ct }]
            }] false
            let Et := mkApp (mkConst `Bounty.E218) tw
            let l := mkApp2 (mkConst ``L218.mk) Et (mkConst ``Bool.true)
            Lean.addDecl <| .defnDecl {
              name := `Bounty.e218
              levelParams := []
              type := Et
              value := mkApp2 (mkConst `Bounty.E218.mk) tw l
              hints := .abbrev
              safety := .safe
            }
            Lean.addDecl <| .defnDecl {
              name := `Bounty.good218
              levelParams := []
              type := mkApp (mkConst ``T218) t
              value := mkConst ``T218.mk
              hints := .abbrev
              safety := .safe
            }
            let Ef := mkApp (mkConst `Bounty.E218) fw
            let Et := mkApp (mkConst `Bounty.E218) tw
            let a := mkApp2 (mkConst `Bounty.E218.mk) fw
              (mkProj `Bounty.E218 0 (mkConst `Bounty.e218))
            let tl := mkApp2 (mkConst ``L218.mk) Et (mkConst ``Bool.true)
            let b := mkApp2 (mkConst `Bounty.E218.mk) tw tl
            let cT := mkApp2 (mkConst ``L218) Et t
            let c := mkApp (mkLambda `l .default cT (mkConst ``Unit.unit)) tl
            let fl := mkApp2 (mkConst ``L218.mk) Ef f
            let d := mkApp2 (mkConst `Bounty.E218.mk) fw fl
            let v := Expr.letE `a Ef a
              (.letE `b Et b
                (.letE `c (mkConst ``Unit) c
                  (.letE `d Ef d (mkConst `Bounty.good218) true) true) true) true
            Lean.addDecl <| .thmDecl {
              name := `Bounty.bad218
              levelParams := []
              type := mkApp (mkConst ``T218) f
              value := v
            }

          theorem false218 : False := nomatch (bad218 : T218 false)
          #print axioms bad218
          #print axioms false218

          end Bounty
          LEAN
          lean --trust=0 RunMetaClosed.lean 2>&1 | tee run-meta-closed.log

      - name: Upload laboratory logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos218-lean-lab-logs
          path: |
            *.log
            *.lean
          retention-days: 7
